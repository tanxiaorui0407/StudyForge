<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyForge · 秋招复习资料拆解工作台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2230; --line:#2a2f3d;
    --text:#e6e8ee; --muted:#8b93a5; --accent:#4f8cff; --accent2:#34d399;
    --danger:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  .wrap{max-width:1200px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  header h1{font-size:22px;margin:0}
  header h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--accent)}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:.2s}
  .drop:hover,.drop.drag{border-color:var(--accent);background:var(--panel2)}
  .drop p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.green{background:var(--accent2);color:#062b1c}
  input[type=file]{display:none}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.4s}
  .muted{color:var(--muted);font-size:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:6px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--muted)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  #mindmap{width:100%;height:520px;background:var(--panel2);border-radius:10px}
  .doc-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .doc-item:hover{border-color:var(--accent)}
  .status{font-size:12px;padding:2px 8px;border-radius:99px}
  .status.ok{background:rgba(52,211,153,.15);color:var(--accent2)}
  .status.run{background:rgba(79,140,255,.15);color:var(--accent)}
  .status.fail{background:rgba(248,113,113,.15);color:var(--danger)}
  .chunk{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel2)}
  .chunk h4{margin:0 0 6px;font-size:14px}
  .kw{display:inline-block;background:rgba(79,140,255,.12);color:var(--accent);border-radius:4px;padding:1px 6px;font-size:12px;margin-right:4px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .fc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
  .fc .f{font-weight:600;color:var(--accent);font-size:14px}
  .fc .b{color:var(--muted);font-size:13px;margin-top:8px;max-height:160px;overflow:auto}
  .fc .tag{font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  .best{color:var(--accent2);font-weight:700}
  .empty{color:var(--muted);text-align:center;padding:30px}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  .badge{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Study<span>Forge</span> · 秋招复习资料拆解工作台</h1>
      <div class="sub">上传 PDF / MD / TXT → 智能分块 → 思维导图 + 知识卡片 → Anki 导出 · “读→拆→记”闭环</div>
    </div>
    <div class="row">
      <span class="badge">本地处理</span>
      <span class="badge">自备 API Key</span>
    </div>
  </header>

  <!-- 上传 -->
  <div class="card">
    <h2>① 上传资料</h2>
    <div class="drop" id="drop">
      <strong>点击选择或拖拽文件到这里</strong>
      <p>支持 .pdf / .md / .txt，最大 30MB</p>
    </div>
    <input type="file" id="file" accept=".pdf,.md,.txt,.markdown">
    <div class="progress" id="prog" style="display:none"><i></i></div>
    <p class="muted" id="progText" style="display:none"></p>
  </div>

  <!-- 文档列表 -->
  <div class="card">
    <h2>② 我的资料</h2>
    <div id="docList"><div class="empty">暂无资料，先上传一份吧。</div></div>
  </div>

  <!-- 详情 -->
  <div id="detail" style="display:none">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0" id="detailTitle">详情</h2>
        <div class="row">
          <button class="btn ghost" onclick="loadDocs()">刷新列表</button>
          <button class="btn green" onclick="exportAnki()">导出 Anki (.txt)</button>
        </div>
      </div>
      <div class="muted" id="detailMeta" style="margin-top:6px"></div>
      <div class="tabs" id="tabs" style="margin-top:12px">
        <div class="tab active" data-t="map">思维导图</div>
        <div class="tab" data-t="chunk">分块</div>
        <div class="tab" data-t="card">知识卡片</div>
        <div class="tab" data-t="compare">分块策略对比</div>
      </div>
      <div id="tabMap"><div id="mindmap"></div></div>
      <div id="tabChunk" style="display:none"></div>
      <div id="tabCard" style="display:none"></div>
      <div id="tabCompare" style="display:none"></div>
    </div>
  </div>

  <footer>StudyForge · 隐私优先（本地处理）+ 成本可见（文件哈希缓存 / 每次调用 token 可查）</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.11/dist/browser/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.11/dist/browser/index.js"></script>
<script>
let currentDocId = null;
let currentDetail = null;
const $ = s => document.querySelector(s);

/* ---------- 上传 ---------- */
const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
fileInput.onchange = e => upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('drag'); upload(e.dataTransfer.files[0]); };

async function upload(file){
  if(!file) return;
  const fd = new FormData(); fd.append('file', file);
  $('#prog').style.display='block'; $('#progText').style.display='block';
  setProgress(5,'上传中…');
  try{
    const r = await fetch('/api/documents/upload',{method:'POST',body:fd});
    const j = await r.json();
    if(!j.success) throw new Error(j.message);
    const {taskId, documentId, reused} = j.data;
    if(reused){
      $('#progText').textContent='检测到相同文件已处理过，直接复用结果（不重复烧 token）。';
      setProgress(100);
      openDoc(documentId);
      setTimeout(()=>{ $('#prog').style.display='none'; $('#progText').style.display='none'; },1500);
      return;
    }
    poll(taskId, documentId);
  }catch(e){
    $('#progText').textContent='上传失败：'+e.message; setProgress(0);
  }
}

async function poll(taskId, documentId){
  for(let i=0;i<600;i++){
    await sleep(1000);
    try{
      const r = await fetch('/api/tasks/'+taskId);
      const j = await r.json();
      const t = j.data;
      setProgress(t.progress||0, stageText(t.stage)+' '+ (t.progress||0)+'%');
      if(t.status==='SUCCEEDED'){ setProgress(100,'处理完成！'); openDoc(documentId); return; }
      if(t.status==='FAILED'){ setProgress(0,'处理失败：'+(t.errorMessage||'未知错误')); return; }
    }catch(e){ /* 网络抖动，继续轮询 */ }
  }
}
function stageText(s){ return ({PARSE:'解析文本',CHUNK:'智能分块',OUTLINE:'生成大纲',CARD:'生成知识卡片'})[s]||'处理'; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function setProgress(p,txt){ $('#prog i').style.width=(p||0)+'%'; if(txt)$('#progText').textContent=txt; }

/* ---------- 文档列表 ---------- */
async function loadDocs(){
  try{
    const j = await (await fetch('/api/documents')).json();
    const list = j.data||[];
    $('#docList').innerHTML = list.length ? list.map(d=>{
      const st = d.status==='SUCCEEDED'?'ok':(d.status==='FAILED'?'fail':'run');
      const stText = d.status==='SUCCEEDED' ? '已完成' : (d.status==='FAILED'?'失败':'处理中');
      return `<div class="doc-item" onclick="openDoc(${d.id})">
        <div><div style="font-weight:600">${esc(d.fileName)}</div>
          <div class="muted">${d.chunkCount} 块 · ${d.cardCount} 张卡片 · ${fmtSize(d.sizeBytes)}</div></div>
        <span class="status ${st}">${stText}</span>
      </div>`;
    }).join('') : '<div class="empty">暂无资料，先上传一份吧。</div>';
  }catch(e){ $('#docList').innerHTML='<div class="empty">加载失败</div>'; }
}

/* ---------- 详情 ---------- */
async function openDoc(id){
  currentDocId=id;
  try{
    const j = await (await fetch('/api/documents/'+id)).json();
    currentDetail=j.data;
    $('#detail').style.display='block';
    $('#detailTitle').textContent='资料详情：'+(currentDetail.fileName||'');
    $('#detailMeta').innerHTML = '状态：'+statusText(currentDetail.status)
      + ' · 大纲模式：'+(currentDetail.outlineMode==='LLM_MAP_REDUCE'?'Map-Reduce（LLM）':'标题兜底（无LLM）')
      + ' · 创建：'+(currentDetail.createdAt||'-');
    renderMap(currentDetail.outline);
    renderChunks(currentDetail.chunks);
    renderCards(currentDetail.cards);
    renderCompare(id);
    switchTab('map');
    $('#detail').scrollIntoView({behavior:'smooth'});
  }catch(e){ alert('加载详情失败：'+e.message); }
}

function renderMap(outline){
  const md = treeToMd(outline);
  const svg = $('#mindmap');
  svg.innerHTML='';
  try{
    const transformer = new window.markmap.Transformer();
    const {root} = transformer.transform(md);
    window.markmap.Markmap.create('#mindmap',{autoFit:true,duration:300,colorFreezeLevel:2,spacingX:160},root);
  }catch(e){ svg.innerHTML='<div class="empty">导图渲染失败：'+e.message+'</div>'; }
}
function treeToMd(node){
  if(!node) return '# 资料大纲';
  let md = '# '+node.title+'\n';
  (function walk(n, depth){
    (n.children||[]).forEach(c=>{
      md += '#'.repeat(Math.max(1,Math.min(6,depth+1)))+' '+c.title+'\n';
      walk(c, depth+1);
    });
  })(node,1);
  return md;
}

function renderChunks(chunks){
  const el=$('#tabChunk');
  if(!chunks||!chunks.length){ el.innerHTML='<div class="empty">暂无分块</div>'; return; }
  el.innerHTML = chunks.map(c=>`
    <div class="chunk">
      <h4>块 ${c.index+1}${c.title?' · '+esc(c.title):''}</h4>
      <div class="muted" style="margin-bottom:6px">${(c.keywords||'').split(',').filter(Boolean).map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>
      <div class="muted">${esc(c.content).slice(0,220)}${(c.content||'').length>220?'…':''}</div>
    </div>`).join('');
}

function renderCards(cards){
  const el=$('#tabCard');
  if(!cards||!cards.length){ el.innerHTML='<div class="empty">暂无卡片</div>'; return; }
  el.innerHTML = `<div class="card-grid">`+cards.map(c=>`
    <div class="fc">
      <div class="f">${esc(c.front)}</div>
      <div class="b">${esc(c.back)}</div>
      <div class="tag">${esc(c.tags||'')} · ${esc(c.sourceRef||'')}</div>
    </div>`).join('')+`</div>`;
}

async function renderCompare(id){
  const el=$('#tabCompare');
  try{
    const j = await (await fetch('/api/documents/'+id+'/compare')).json();
    const list=j.data||[];
    if(!list.length){ el.innerHTML='<div class="empty">无全文，无法对比</div>'; return; }
    // 主题一致性最高者标优
    const bestConsistency = Math.max(...list.map(x=>x.metrics.avgTopicConsistency));
    el.innerHTML = `<table>
      <tr><th>策略</th><th>块数</th><th>平均块长</th><th>长度方差</th><th>主题一致性</th><th>覆盖率</th><th>前几块标题</th></tr>
      ${list.map(x=>`
        <tr>
          <td><strong>${strategyName(x.strategy)}</strong></td>
          <td>${x.metrics.blockCount}</td>
          <td>${x.metrics.avgBlockLen.toFixed(0)}</td>
          <td>${x.metrics.sizeVariance.toFixed(0)}</td>
          <td class="${x.metrics.avgTopicConsistency===bestConsistency?'best':''}">${x.metrics.avgTopicConsistency.toFixed(3)}</td>
          <td>${(x.metrics.coverageRatio*100).toFixed(0)}%</td>
          <td class="muted">${(x.chunkTitles||[]).slice(0,3).map(esc).join(' / ')||'-'}</td>
        </tr>`).join('')}
    </table>
    <p class="muted" style="margin-top:8px">指标口径：块内主题一致性 = 相邻句窗口词汇重叠度均值（越高越聚焦）；与块数配合看，一致性好且块数不多者更优。也可在 README 用 embedding 升级为向量级语义分块。</p>`;
  }catch(e){ el.innerHTML='<div class="empty">对比加载失败</div>'; }
}
function strategyName(s){ return ({FIXED_LENGTH:'固定长度',HEADING_BASED:'按标题层级',SEMANTIC_BOUNDARY:'语义边界'})[s]||s; }

function exportAnki(){
  if(!currentDocId) return;
  window.open('/api/documents/'+currentDocId+'/cards/export','_blank');
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));
  $('#tabMap').style.display = t==='map'?'block':'none';
  $('#tabChunk').style.display = t==='chunk'?'block':'none';
  $('#tabCard').style.display = t==='card'?'block':'none';
  $('#tabCompare').style.display = t==='compare'?'block':'none';
}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>switchTab(x.dataset.t));

function statusText(s){ return ({SUCCEEDED:'已完成',FAILED:'失败',PENDING:'待处理',PARSING:'解析中',CHUNKING:'分块中',OUTLINING:'大纲生成中',CARDING:'卡片生成中'})[s]||s; }
function fmtSize(b){ if(!b) return '0 B'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadDocs();
</script>
</body>
</html>
