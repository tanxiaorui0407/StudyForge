# 一键启动：docker compose up -d --build
# 前端打开 http://localhost:8080
services:
  mysql:
    image: mysql:8.0
    container_name: studyforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studyforge
      MYSQL_USER: studyforge
      MYSQL_PASSWORD: studyforge
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: studyforge-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studyforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: studyforge
      SPRING_DATASOURCE_PASSWORD: studyforge
      # 在 .env 文件里填你自己的 API Key（.env 已被 .gitignore 忽略，不会泄漏到 GitHub）
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
